<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes, ou tente aumetar e diminuir o tamanho em seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m-700.png" type="image/png">
        <img src="imagens/foto-g-1000.png" alt="imagem flexível">
    </picture>
    <!-- A tag picture, nesse caso, permite criar um ambiente no qual se possa trabalhar com imagens de diferentes tamanhos a depender do tamanho da tela do usuário -->
    <!-- A tag source:media:type, nesse caso, serve como um if. Ao configurar a quantidade min ou máx de px da tela, é possível atribuir diferentes imagens a diferentes tamanhos -->
    <!-- OBS: Ajustar a quantidade de px com folga de 50px. Quanto menor a imagem, seu source deve vir mais acima, no caso de max-width. -->

    <h1>Áudios</h1>
    <p>Reproduzindo áudios no HTML5</p>
    <!-- MP3, WAV, OGG -->
    <audio preload="metadata" controls loop>
        <source src="midia/kimmich-mentality.mpeg" type="audio/mpeg">
        <source src="midia/kimmich-mentality.mpeg" type="audio/mpeg">
        <source src="midia/kimmich-mentality.mpeg" type="audio/mpeg">
        <p>Infelizmente não foi possível reproduzir, mas é possível baixar <a href="midia/kimmich-mentality.mpeg">aqui</a></p>
    </audio>
    <!-- Parâmetro autoplay fará com que o áudio toque automaticamente ao abrir a página. Parâmetro controls exibirá um player para tocar o áudio -->
</html>
