<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Símbolos e Emojis</title>
</head>
<body>
    <h1>Linhas, símbolos e emojis</h1>
    <hr> <!-- Adiciona linha horizontal -->
    <p>É possível escrever qualquer coisa entre as tags</p>
    <p>Caso seja necessário quebra de linha <br> Utilizar a tag &lt;br&gt; <!-- LESS THAN / GREATER THAN --></p> 
    <p>Adicionando símbolos especiais: 
        &reg; <!-- Marca Registrada -->
        &copy; <!-- Copyright -->
        &trade; <!-- "TM", Marca Registrada em Inglês -->
        &euro; <!-- Euro -->
        &pound; <!-- Libra -->
        &yen; <!-- Iene -->
        &cent; <!-- Centavo de Dólar -->
        &Delta; <!-- Delta minúsculo ou maiúsculo, só mudar a primeira letra -->
        &uparrow; <!-- Seta pra cima-->
    </p>  
    <p>Emojis: <!-- Para encontrar, acessar emojipedia -->
        &#x1F596;
        &#x1F913;
    </p>  
</body>
</html>
