<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Configuração global do CSS */
        * {
            height: 100%;
        }

        body {
            /* linear-gradient = to right, left, bottom, top ou deg */
            /* radial-gradient = circle */
            background-image: linear-gradient(to bottom, #7A44B5, #993DAA, #B73595, #DC3E5F, #F8B867);
            background-attachment: fixed;
        }
    </style>
    <title>Gradiente em CSS</title>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
